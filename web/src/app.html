<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <!-- No analytics script. No tag manager. No font CDN that would hand a
         third party the visitor list of a police-misconduct site. -->
    <title>নিরাপদ.site (ডেমো / DEMO)</title>
    <meta name="description" content="Ward-level reporting of street crime, extortion, police misconduct and street hazards in Bangladesh. Demonstration build: all figures are synthetic." />
    <!-- A review build must not be indexed. The numbers are not real, and a
         search result for "Badda crime statistics" pointing here would be
         worse than no site at all. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1113'/%3E%3Cpath d='M16 5l9 4v7c0 5.5-3.8 10.2-9 11.4C10.8 26.2 7 21.5 7 16V9z' fill='none' stroke='%23d98b3a' stroke-width='2.2'/%3E%3C/svg%3E" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display:contents">%sveltekit.body%</div>
  </body>
</html>
